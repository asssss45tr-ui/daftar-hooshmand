name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk daftar-hooshmand.apk

      - uses: actions/upload-artifact@v4
        with:
          name: daftar-hooshmand-apk
          path: daftar-hooshmand.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: آخرین نسخه‌ی دفتر حساب
          body: "فایل نصبی اندروید: daftar-hooshmand.apk (نسخه ${{ github.run_number }})"
          files: daftar-hooshmand.apk
          make_latest: true
